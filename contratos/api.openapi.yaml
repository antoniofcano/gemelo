# Contrato HTTP de la api del gemelo (fase F1a). Lo vigila apps/api/pruebas/unidad/app.test.ts: cada ruta registrada
# está aquí y cada operación de aquí existe. La ficha de haza remite a haza.schema.json (lista blanca, ADR-0014);
# la sesión, a sesion.md (ADR-0013); la vida de las hazas (olivos personalizados, fotos, denuncias, bandeja), a vida.md
# y olivos-haza.schema.json. Todo POST/PUT/DELETE exige Origin del sitio (salvo /api/csp-informe).
openapi: 3.1.0
info:
  title: Gemelo · api
  version: 0.2.0
  description: >
    Servidor de una persona (F1a): enlace mágico, código corto para las gafas, sesión en cookie, hazas (GeoJSON y ficha pública sin titular ni
    kilos), lectura de OlivarTrack por MCP. Sin sesión solo responde lo de acceso y la salud (decisión 16).
servers:
  - url: https://gemelo.canoydamas.es
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: __Host-gemelo
      description: "HttpOnly; Secure; SameSite=Lax; Path=/. Ver contratos/sesion.md."
  schemas:
    Avatar:
      type: object
      additionalProperties: false
      required: [camisa, sombrero, piel, vrm]
      properties:
        camisa: { type: integer, minimum: 0, maximum: 5 }
        sombrero: { enum: [ninguno, paja, gorra] }
        piel: { type: integer, minimum: 0, maximum: 4 }
        vrm: { type: [string, "null"], description: "id del catálogo de avatares VRM; null = el muñeco de bloque" }
        tono: { type: integer, minimum: 0, maximum: 9, description: "AV2 (opcional): tono de piel del muñeco, de los 10 de la paleta del motor (ninguno es «el de serie»); manda sobre `piel`" }
        arriba: { type: integer, minimum: 0, maximum: 9, description: "AV2 (opcional): color de la ropa de arriba, de los 10 de la paleta (nombres del campo); manda sobre `camisa`" }
        abajo: { type: integer, minimum: 0, maximum: 9, description: "AV2 (opcional): color de la ropa de abajo (pantalón o falda), de la misma paleta" }
        altura: { enum: [baja, media, alta], description: "AV2 (opcional): escala el muñeco" }
        complexion: { enum: [delgada, media, ancha], description: "AV2 (opcional): ensancha o afina el muñeco" }
        movilidad: { enum: [pie, baston, andador, silla], description: "AV2 (opcional): apoyo que lleva; con `silla` el muñeco va sentado con sus ruedas. No es una pose: la calcula quien mira" }
    RecordJuego:
      type: object
      additionalProperties: false
      required: [juego, record, partidas]
      properties:
        juego: { type: string }
        es_record: { type: boolean, description: "solo al guardar: esta partida es el récord nuevo del hogar" }
        record:
          type: [object, "null"]
          additionalProperties: false
          required: [puntos, duracion_s, fecha]
          properties:
            puntos: { type: integer }
            duracion_s: { type: integer }
            fecha: { type: string, format: date-time }
        partidas: { type: integer, minimum: 0 }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        mensaje: { type: string }
    GeometriaHaza:
      description: "Linde de una haza dibujada en la oficina: GeoJSON Polygon o MultiPolygon en EPSG:25830 (E, N en metros), anillos cerrados, como mucho 2000 vértices"
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [Polygon] }
            coordinates: { type: array, minItems: 1, items: { type: array, minItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } } }
        - type: object
          additionalProperties: false
          required: [type, coordinates]
          properties:
            type: { type: string, enum: [MultiPolygon] }
            coordinates: { type: array, minItems: 1, items: { type: array, minItems: 1, items: { type: array, minItems: 4, items: { type: array, minItems: 2, maxItems: 2, items: { type: number } } } } }
    Hazas:
      type: object
      additionalProperties: false
      required: [type, srs, features]
      properties:
        type: { const: FeatureCollection }
        srs: { enum: ["EPSG:25830", "EPSG:4326"], description: "miembro ajeno a RFC 7946: el motor trabaja en UTM 30N" }
        features:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [type, id, geometry, properties]
            properties:
              type: { const: Feature }
              id: { type: integer }
              geometry:
                type: object
                properties:
                  type: { const: MultiPolygon }
                  coordinates: { type: array }
              properties:
                type: object
                additionalProperties: false
                required: [codigo, nombre, finca, es_mia]
                properties:
                  codigo: { type: string }
                  nombre: { type: string }
                  finca: { type: string }
                  es_mia: { type: boolean }
  responses:
    SinSesion:
      description: Sin sesión (o caducada o revocada)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    SinPermiso:
      description: "Con sesión pero sin el rol (sin_permiso); o cuenta de oficina con el aparato pendiente (aparato_pendiente); o falta la confirmación reciente (confirmacion_requerida). contratos/sesion.md § Oficina"
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    OrigenNoAdmitido:
      description: POST/PUT/DELETE sin Origin del sitio
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    EntradaNoValida:
      description: El cuerpo, la consulta o la ruta no cumplen el esquema (los campos de más se rechazan)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Limite:
      description: Demasiadas peticiones; mismo texto para cualquier correo
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

paths:
  /api/salud:
    get:
      summary: La api está viva y la base responde
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { estado: { const: ok }, bd: { const: ok } } } } } }
        "503": { description: la base no responde }

  /api/csp-informe:
    post:
      summary: Informe de la CSP (Report-Only); exento de Origin, 8 KB como mucho
      requestBody:
        content:
          application/csp-report: { schema: { type: object } }
          application/reports+json: { schema: { type: array } }
      responses:
        "204": { description: recibido }

  /api/auth/enlace:
    post:
      summary: Pide un enlace mágico; respuesta IDÉNTICA exista o no la cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [correo], properties: { correo: { type: string, maxLength: 254 } } }
      responses:
        "202": { description: aceptado (se haya mandado o no), content: { application/json: { schema: { type: object, properties: { mensaje: { type: string } } } } } }
        "400": { description: correo mal formado }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/auth/entrar:
    get:
      summary: Página intermedia del enlace (no lo gasta; un escáner de correo no puede consumirlo)
      parameters:
        - { name: t, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
      responses:
        "200": { description: página con el botón «Entrar» (formulario POST), content: { text/html: {} } }
        "400": { description: enlace caducado, usado o no válido, content: { text/html: {} } }
    post:
      summary: Gasta el enlace (un solo uso) y abre una sesión NUEVA (rotación)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: false, required: [t], properties: { t: { type: string } } }
          application/json:
            schema: { type: object, additionalProperties: false, required: [t], properties: { t: { type: string } } }
      responses:
        "303": { description: "formulario: sesión abierta (Set-Cookie __Host-gemelo); a /#bienvenida si le toca el primer acceso (normas sin aceptar), si no a /finca/. Una cuenta de oficina (ADR-0024): a /oficina/ si el aparato está aprobado, a /api/oficina/pendiente si no (y Set-Cookie __Host-gemelo-aparato si el aparato es nuevo)" }
        "200": { description: "JSON: sesión abierta", content: { application/json: { schema: { type: object, additionalProperties: false, required: [ok, primer_acceso], properties: { ok: { const: true }, primer_acceso: { type: boolean }, aparato: { enum: [pendiente, aprobado], description: "solo en cuentas de oficina: si el aparato ya está aprobado (contratos/sesion.md § Oficina)" } } } } } }
        "400": { description: "enlace caducado, usado o no válido" }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }

  /api/auth/vincula:
    post:
      summary: "Unas gafas sin sesión piden un código corto (contratos/sesion.md § Código corto): 6 símbolos sin ambiguos, 5 min, un solo uso"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
      responses:
        "201":
          description: "el código para enseñarlo, el secreto de sondeo (solo para estas gafas) y cada cuánto sondear"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [codigo, sondeo, expira_en, cada_s]
                properties:
                  codigo: { type: string, pattern: "^[2-9A-HJKMNP-Z]{3}-[2-9A-HJKMNP-Z]{3}$" }
                  sondeo: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
                  expira_en: { type: string, format: date-time }
                  cada_s: { type: integer, minimum: 1 }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/auth/vincula/sondeo:
    post:
      summary: "Las gafas preguntan si ya se aprobó su código; al verlo aprobado se gasta (atómico) y reciben su propia sesión"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [sondeo], properties: { sondeo: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } } }
      responses:
        "200":
          description: "esperando, rechazado o caducado (también si el secreto no existe); aprobado lleva Set-Cookie __Host-gemelo (sesión nueva, rotación)"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [estado]
                properties:
                  estado: { enum: [esperando, aprobado, rechazado, caducado] }
                  primer_acceso: { type: boolean, description: "solo con estado aprobado" }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/sesion:
    get:
      summary: Quién soy (rol, alias y si me toca el primer acceso)
      security: [{ sesion: [] }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, additionalProperties: false, required: [rol, alias, alias_visible, primer_acceso, titular], properties: { rol: { enum: [hogar, guia, corresponsal, oficina, admin] }, alias: { type: [string, "null"] }, alias_visible: { type: boolean }, primer_acceso: { type: boolean, description: "true si no ha aceptado la versión vigente de las normas (PUT /api/yo/normas)" }, titular: { type: boolean, description: "true si la sesión nació del enlace mágico (el adulto titular); false en un aparato vinculado con el código corto. Solo el titular cuelga contenido (decisión 96, vida.md)" } } } } } }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/sesion/salir:
    post:
      summary: Cierra esta sesión (se revoca en la base y se borra la cookie)
      responses:
        "204": { description: cerrada }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }

  /api/sesion/salir-todas:
    post:
      summary: Cierra todas las sesiones del hogar
      security: [{ sesion: [] }]
      responses:
        "204": { description: cerradas }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/interno/autoriza:
    get:
      summary: Para el forward_auth del Caddy interno (Caddy la cierra desde fuera con 404)
      parameters:
        - { name: para, in: query, schema: { enum: [oficina] }, description: "oficina: además, rol oficina o admin (lo pone el Caddy en /oficina/, ADR-0024)" }
      responses:
        "204": { description: "hay sesión (y, con para=oficina, es de oficina con el aparato aprobado)" }
        "303": { description: "es una navegación sin sesión (a la portada) o de una cuenta de oficina con el aparato pendiente (a /api/oficina/pendiente)" }
        "401": { description: "sin sesión" }
        "403": { description: "con para=oficina y sesión de hogar; o aparato de oficina pendiente y no es una navegación" }

  /api/hazas:
    get:
      summary: Lindes de las hazas en GeoJSON (sin titular)
      security: [{ sesion: [] }]
      parameters:
        - { name: srs, in: query, schema: { enum: ["25830", "4326"], default: "25830" } }
        - { name: finca, in: query, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
      responses:
        "200": { description: ok, content: { application/geo+json: { schema: { $ref: "#/components/schemas/Hazas" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/hazas/{id}:
    get:
      summary: Ficha pública de una haza (lista blanca)
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "haza.schema.json" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: no existe }

  /api/tiempo:
    get:
      summary: El tiempo de la explotación según Vigía (actual medido y previsión modelada de 72 h; contratos/tiempo.md)
      description: >
        Lista blanca de tiempo.schema.json: sin dentroDeUmbrales (Vigía no autoriza tratamientos). La api guarda en memoria el
        actual 10 min y la previsión 1 h. Los textos son de Vigía: datos que el cliente escapa, nunca instrucciones.
      security: [{ sesion: [] }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "tiempo.schema.json" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "429": { $ref: "#/components/responses/Limite" }
        "503": { description: "el tiempo está apagado en este servidor (tiempo_apagado, GEMELO_VIGIA=no) o Vigía no responde y no hay lectura reciente (vigia_no_responde)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/tiempo/historico:
    get:
      summary: El histórico meteorológico de la explotación según Vigía (historico_meteo; contratos/tiempo.md)
      description: >
        Lista blanca de tiempo-historico.schema.json. `desde` y `hasta` son días AAAA-MM-DD (hasta no antes que desde, como mucho
        31 días). La api guarda cada rango en memoria 1 h. Los textos son de Vigía: datos que el cliente escapa, nunca instrucciones.
      security: [{ sesion: [] }]
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
        - { name: hasta, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "tiempo-historico.schema.json" } } } }
        "400": { description: "rango no válido (rango_no_valido)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "429": { $ref: "#/components/responses/Limite" }
        "503": { description: "el tiempo está apagado en este servidor (tiempo_apagado) o Vigía no responde y no hay lectura reciente (vigia_no_responde)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/yo/alias:
    put:
      summary: Alias del hogar (3–20 caracteres) y si se muestra en sus hazas
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [alias, visible], properties: { alias: { type: string }, visible: { type: boolean } } }
      responses:
        "204": { description: guardado }
        "400": { description: alias no válido o reservado }
        "409": { description: alias ocupado }

  /api/yo/normas:
    put:
      summary: "Primer acceso: acepta la versión vigente de las normas y la privacidad (UX.md §4.5) y si quiere avisos por correo"
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [version, avisos_correo], properties: { version: { type: integer, minimum: 1 }, avisos_correo: { type: boolean } } }
      responses:
        "204": { description: aceptadas }
        "401": { $ref: "#/components/responses/SinSesion" }
        "409": { description: "la versión no es la vigente (las normas cambiaron mientras se leían)" }

  /api/yo/dispositivos/vincular:
    post:
      summary: "Configuración → Mis dispositivos → Vincular: aprueba (o rechaza) el código que enseñan unas gafas"
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [codigo, aprobar], properties: { codigo: { type: string, pattern: "^[ A-Za-z0-9-]{6,12}$", description: "con o sin guion; se normaliza a mayúsculas" }, aprobar: { type: boolean } } }
      responses:
        "204": { description: "aprobado (las gafas entran en su próximo sondeo) o rechazado" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }
        "404": { description: "el código no sirve: la MISMA respuesta si no existe, caducó o ya se decidió (no enumerable)" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/yo/avatar:
    get:
      summary: Lo que el hogar tiene elegido (la portada lo lee de vuelta)
      security: [{ sesion: [] }]
      responses:
        "200":
          description: ok (sin caché)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Avatar" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: "todavía no ha elegido (la portada parte de los valores por defecto)" }
    put:
      summary: Avatar del hogar, el muñeco de bloque y, si quiere, un avatar VRM del catálogo
      description: |
        `camisa`, `sombrero` y `piel` se guardan siempre: son el muñeco lejano y la caída cuando el VRM no carga (ADR-0020 §5-6).
        `vrm` es el `id` de `/avatares/catalogo.json` ([avatares.md](avatares.md)); ausente o `null`, el muñeco. La api no conoce el
        catálogo (lo sirve Caddy): un id que ya no esté en él lo trata el cliente como ausente. Viaja en los metadatos de presencia
        (`avatar.vrm`) solo si hay uno.

        AV2 (decisión 131): `tono`, `arriba`, `abajo`, `altura`, `complexion` y `movilidad` son **opcionales** y de listas cerradas (nada de género);
        el contrato sigue en v1 (un cliente de antes los ignora). Un PUT sin ellos los borra; viajan en los metadatos de presencia solo los elegidos.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [camisa, sombrero, piel]
              properties:
                camisa: { type: integer, minimum: 0, maximum: 5 }
                sombrero: { enum: [ninguno, paja, gorra] }
                piel: { type: integer, minimum: 0, maximum: 4 }
                vrm: { type: [string, "null"], pattern: "^[a-z0-9-]{1,32}$" }
                tono: { type: integer, minimum: 0, maximum: 9 }
                arriba: { type: integer, minimum: 0, maximum: 9 }
                abajo: { type: integer, minimum: 0, maximum: 9 }
                altura: { enum: [baja, media, alta] }
                complexion: { enum: [delgada, media, ancha] }
                movilidad: { enum: [pie, baston, andador, silla] }
      responses:
        "204": { description: guardado }
        "400": { description: "la petición no tiene la forma esperada" }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/yo/datos:
    get:
      summary: Todo lo que se guarda del hogar (derecho de acceso y portabilidad, RGPD)
      security: [{ sesion: [] }]
      responses:
        "200": { description: JSON para descargar }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/yo:
    delete:
      summary: Borra la cuenta y, en cascada, todo lo suyo (derecho de supresión, RGPD)
      security: [{ sesion: [] }]
      responses:
        "204": { description: borrada }
        "401": { $ref: "#/components/responses/SinSesion" }

  /api/admin/hogares:
    get:
      summary: "Familias (oficina): lista con búsqueda q (correo, alias, nombre interno, haza), filtro estado (activa, pendiente = sin primer acceso, baja) y paginación. Devuelve { hogares: [{ id, correo, rol, alias, alias_visible, activo, nombre_interno, estado, hazas (códigos), sesiones, creado_en, baja_en, borrado_en, avisos_correo, normas_version, normas_aceptadas_en }], total }"
      security: [{ sesion: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: estado, in: query, schema: { enum: [activa, pendiente, baja] } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: ok }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      summary: "Da de alta un hogar (las cuentas las da la explotación) y le manda el enlace de bienvenida (enviar: false lo evita). Opcionales: nombre_interno (solo lo ve la oficina, decisión 109) y haza_id (si la tenía otra familia, se le quita y se dice en haza_quitada_a). Una cuenta de oficina (rol oficina o admin): solo admin, con confirmación reciente"
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [correo, rol]
              properties:
                correo: { type: string }
                rol: { enum: [hogar, guia, corresponsal, oficina, admin] }
                nombre_interno: { type: [string, "null"], maxLength: 60 }
                haza_id: { type: [integer, "null"] }
                enviar: { type: boolean }
      responses:
        "201": { description: "creado: { id, enlace_enviado, haza_quitada_a }" }
        "400": { description: correo no válido o haza que no existe }
        "409": { description: ya existe }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}:
    patch:
      summary: "Cambia el nombre interno (decisión 109), quita el alias (si es ofensivo) o cambia el rol (solo admin, con confirmación reciente; nunca el propio ni el del último admin)"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                nombre_interno: { type: [string, "null"], maxLength: 60 }
                quitar_alias: { const: true }
                rol: { enum: [hogar, guia, corresponsal, oficina, admin] }
      responses:
        "204": { description: hecho }
        "404": { description: no existe }
        "409": { description: a ti mismo o último admin }
        "403": { $ref: "#/components/responses/SinPermiso" }
    delete:
      summary: "Borra un hogar en cascada ya (RGPD). Pide confirmación reciente y el correo de la cuenta escrito en el cuerpo; borrar una cuenta de oficina, solo admin"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [correo], properties: { correo: { type: string } } }
      responses:
        "204": { description: borrado }
        "400": { description: el correo escrito no es el de la cuenta }
        "404": { description: no existe }
        "409": { description: a ti mismo o último admin }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/enlace:
    post:
      summary: Reenvía el enlace de entrada (el de bienvenida si aún no ha entrado); mismos límites por correo que la entrada normal
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "202": { description: mandado }
        "404": { description: no existe }
        "409": { description: la cuenta está de baja }
        "429": { $ref: "#/components/responses/Limite" }
        "502": { description: el correo no salió }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/sesiones:
    get:
      summary: "Sesiones abiertas de una cuenta ({ sesiones: [{ id, aparato, por_codigo_corto, creada_en, ultima_actividad_en, expira_en }], aparatos_oficina })"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: ok }
        "404": { description: no existe }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/sesiones/{id}:
    delete:
      summary: Cierra una sesión (las de cuentas de oficina, solo admin o la propia cuenta)
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: cerrada }
        "404": { description: no existe o ya estaba cerrada }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/haza:
    put:
      summary: "Asigna (o quita, con null) la haza de una familia (decisión 91: una por hogar; suelta las demás). Si la tenía otra familia se le quita y se dice en quitada_a"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [haza_id], properties: { haza_id: { type: [integer, "null"] } } }
      responses:
        "200": { description: "{ haza_id, quitada_a: { id, correo } | null, soltadas }" }
        "404": { description: la cuenta o la haza no existen }
        "409": { description: la cuenta está de baja }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/baja:
    post:
      summary: "Da de baja (decisión 108): cierra sus sesiones, la haza queda sin titular y su contenido se oculta al momento; se borra a los 30 días. Devuelve { borrado_en }"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: de baja }
        "404": { description: no existe }
        "409": { description: ya de baja, a ti mismo o último admin }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/reactivar:
    post:
      summary: "Reactiva una cuenta de baja y le devuelve las hazas que siguen sin titular. Devuelve { hazas_devueltas }"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: reactivada }
        "404": { description: no existe }
        "409": { description: no está de baja }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hogares/{id}/exportar:
    get:
      summary: Todos los datos de la cuenta en JSON (RGPD), los mismos de GET /api/yo/datos más el nombre interno
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: ok (attachment) }
        "404": { description: no existe }
        "403": { $ref: "#/components/responses/SinPermiso" }

  # ---------------------------------------------------------------- hazas de la oficina (OF3, doc/sistema/OFICINA.md §4)
  /api/admin/hazas:
    get:
      summary: "Las hazas como las ve la oficina: { srs: EPSG:25830, hazas: [{ id, codigo, nombre, finca, hogar_id, hogar_correo, version, superficie_ha, olivos, olivos_borde, olivos_declarados, olivos_declarados_fuente, parcelas [{ id, ha }], solapes [{ id, codigo, m2 }], actualizada_en, geometria? }] }"
      description: >
        olivos = olivos medidos (LiDAR) dentro o en la linde, el mismo recuento que la ficha pública (PostGIS, ST_Intersects); olivos_borde = de
        ellos, los que están a menos de 1 m de la linde; solapes = otras hazas de la finca que pisa en más de 0,5 m². Con geometria=true trae la
        linde (MultiPolygon en EPSG:25830, al centímetro). Familias la usa sin geometría para elegir haza.
      security: [{ sesion: [] }]
      parameters:
        - { name: finca, in: query, required: false, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
        - { name: geometria, in: query, required: false, schema: { type: boolean } }
      responses:
        "200": { description: ok }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      summary: "Crea una haza dibujada en la oficina. Devuelve 201 { haza } con el recuento del servidor"
      description: >
        PostGIS valida: geometría legible y válida (ST_IsValid; 400 geometria_no_valida con motivo), al menos 10 m² (demasiado_pequena), dentro
        de la finca = la caja de sus olivos medidos con 150 m de margen (fuera_de_finca; sin olivos de la finca, finca_desconocida) y sin pisar
        otra haza de la finca en más de 0,5 m² (409 solape, con la lista). Nace sin familia y con su versión 1 (accion crear). Auditoría admin.haza_creada.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [codigo, nombre, finca, geometria]
              properties:
                codigo: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
                nombre: { type: string, minLength: 1, maxLength: 60 }
                finca: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
                geometria: { $ref: "#/components/schemas/GeometriaHaza" }
                nota: { type: string, maxLength: 200 }
      responses:
        "201": { description: creada }
        "400": { description: "geometría no válida, fuera de la finca, demasiado pequeña o anillo abierto", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "409": { description: "pisa otra haza (solape, con solapes [{ id, codigo, m2 }]) o el código ya existe (codigo_repetido)" }

  /api/admin/hazas/{id}/geom:
    put:
      summary: "Guarda la linde editada como versión nueva, sobre la versión que se editó. Devuelve { haza, sin_cambios, personalizados_fuera }"
      description: >
        Mismas comprobaciones que al crear (sin contar la propia haza en los solapes). Si otra persona guardó después de `version`, 409
        version_cambiada con la haza actual (`actual`), sin pisarla. personalizados_fuera = árboles con nombre o foto de la familia que quedan
        fuera de la linde nueva (aviso). Auditoría admin.haza_editada.
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [geometria, version]
              properties:
                geometria: { $ref: "#/components/schemas/GeometriaHaza" }
                version: { type: integer, minimum: 1 }
                nota: { type: string, maxLength: 200 }
      responses:
        "200": { description: guardada }
        "400": { description: "geometría no válida o fuera de la finca", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "otra persona guardó antes (version_cambiada, con actual) o pisa otra haza (solape)" }

  /api/admin/hazas/{id}/partir:
    post:
      summary: "Parte la haza por la línea entre dos de sus vértices (ST_Split). Devuelve 201 { haza, nueva }"
      description: >
        a y b se llevan a su vértice más cercano (a menos de 5 cm). El corte debe ir por dentro y dejar exactamente dos trozos de al menos 10 m²
        (400 corte_no_valido o demasiado_pequena); solo hazas de un único polígono. El trozo mayor se queda en la haza (versión nueva, accion
        partir, conserva su familia); el otro es una haza nueva con `codigo` y `nombre`, sin familia y con las mismas parcelas de OlivarTrack.
        Auditoría admin.haza_partida.
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [a, b, version, codigo, nombre]
              properties:
                a: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
                b: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
                version: { type: integer, minimum: 1 }
                codigo: { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
                nombre: { type: string, minLength: 1, maxLength: 60 }
                nota: { type: string, maxLength: 200 }
      responses:
        "201": { description: partida }
        "400": { description: "corte no válido o trozo demasiado pequeño", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "otra persona guardó antes (version_cambiada) o el código ya existe (codigo_repetido)" }

  /api/admin/hazas/juntar:
    post:
      summary: "Junta dos hazas vecinas (ST_Union): a se queda con todo y b desaparece. Devuelve { haza, quitada, titular_de_la_segunda }"
      description: >
        Pide confirmación reciente (403 confirmacion_requerida; ADR-0024). Las dos de la misma finca, a menos de 5 cm (409 no_vecinas) y sin
        familias distintas (409 titulares_distintos). Lo que colgaba de b (árboles con nombre, diario, lotes, bandeja, avisos, visitas, preguntas,
        parcelas) pasa a a; los eventos de OlivarTrack de b se borran y la siguiente sincronía los rehace. La historia de b se queda en
        hazas_versiones (accion juntada_en). Auditoría admin.hazas_juntadas.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [a, b, version_a, version_b]
              properties:
                a: { type: integer, minimum: 1 }
                b: { type: integer, minimum: 1 }
                version_a: { type: integer, minimum: 1 }
                version_b: { type: integer, minimum: 1 }
                nota: { type: string, maxLength: 200 }
      responses:
        "200": { description: juntadas }
        "400": { description: "la misma haza, otra finca o unión no válida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: alguna no existe }
        "409": { description: "no son vecinas, son de familias distintas u otra persona guardó antes (version_cambiada)" }

  /api/admin/hazas/{id}:
    delete:
      summary: Borra una haza sin familia y sin nada colgado (árboles con nombre, diario, lotes); su historia queda en hazas_versiones
      description: Pide confirmación reciente (403 confirmacion_requerida). Con familia, 409 con_titular; con algo colgado, 409 con_contenido (mejor juntarla). Auditoría admin.haza_borrada.
      security: [{ sesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: borrada }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "con familia, con algo colgado u otra persona guardó antes" }

  /api/admin/hazas/{id}/versiones:
    get:
      summary: "El historial de la haza, de la última a la primera: { versiones: [{ version, accion, cuando, autor (correo de la cuenta de oficina o null), nota, desde_version, superficie_ha, parcelas, geometria }] }"
      description: accion es inicial, carga (la tubería), crear, editar, partir, partida_de, juntar, juntada_en, volver o borrar. Sigue respondiendo aunque la haza ya no exista (juntada o borrada).
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: ok }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }

  /api/admin/hazas/{id}/volver/{version}:
    post:
      summary: "Vuelve a una versión vieja guardando una COPIA de su linde como versión nueva (la vieja no se toca). Devuelve { haza, personalizados_fuera }"
      description: La linde vieja pasa las comprobaciones de hoy (dentro de la finca, sin solapes). version_actual es la versión que se estaba viendo (409 version_cambiada si otra persona guardó). 409 sin_cambios si ya es igual. Auditoría admin.haza_vuelta.
      security: [{ sesion: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version_actual]
              properties:
                version_actual: { type: integer, minimum: 1 }
                nota: { type: string, maxLength: 200 }
      responses:
        "200": { description: vuelta }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: "la haza o la versión no existen" }
        "409": { description: "pisa otra haza (solape), sin cambios u otra persona guardó antes" }

  /api/admin/hogares/{id}/revocar:
    post:
      summary: Cierra todas las sesiones de un hogar
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: cerradas }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/hazas/{id}/hogar:
    put:
      summary: Asigna (o quita) la haza a un hogar (decisión 12)
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [hogar_id], properties: { hogar_id: { type: [integer, "null"] } } }
      responses:
        "204": { description: asignada }
        "400": { description: el hogar no existe }
        "404": { description: la haza no existe }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/sincronia:
    post:
      summary: Lanza una sincronía con OlivarTrack (contratos/olivartrack-sync.md)
      security: [{ sesion: [] }]
      responses:
        "200": { description: resumen por herramienta (estado ok/truncado/parcial/error) }
        "503": { description: la lectura de OlivarTrack está apagada }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/oficina/sesion:
    get:
      summary: "La sesión de oficina (ADR-0024): rol, aparato (pendiente o aprobado), caducidad y si hay confirmación reciente. Vale con el aparato pendiente"
      security: [{ sesion: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [rol, aparato, caduca_en, inactividad_min, confirmada_en, confirmacion_vigente]
                properties:
                  rol: { enum: [oficina, admin] }
                  aparato: { type: object, additionalProperties: false, required: [id, nombre, estado], properties: { id: { type: integer }, nombre: { type: string }, estado: { enum: [pendiente, aprobado] } } }
                  caduca_en: { type: [string, "null"], format: date-time, description: "caducidad absoluta (12 h desde que se entró, por defecto)" }
                  inactividad_min: { type: integer, description: "minutos sin actividad que cierran la sesión (120 por defecto)" }
                  confirmada_en: { type: [string, "null"], format: date-time }
                  confirmacion_vigente: { type: boolean, description: "true si se entró con un enlace hace menos de GEMELO_OFICINA_CONFIRMACION_MIN (15 min)" }
                  ot_proponer: { enum: [manual, token], description: "cómo se pasa algo a OlivarTrack desde la bandeja (GEMELO_OFICINA_OT_PROPONER): manual = copiar el texto y apuntar el id de la propuesta; token queda reservado para el token de solo proponer (DO-7)" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/oficina/pendiente:
    get:
      summary: "Página HTML «este aparato está pendiente» (a donde va una cuenta de oficina que entra desde un aparato nuevo)"
      responses:
        "200": { description: la página, content: { text/html: {} } }
        "303": { description: "sin sesión de oficina, a la portada; con el aparato ya aprobado, a /oficina/" }

  /api/oficina/confirmar:
    post:
      summary: "Manda un enlace nuevo a la propia cuenta de oficina: entrar con él es la confirmación reciente (abre una sesión nueva)"
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: {} }
      responses:
        "202": { description: enlace mandado }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/admin/aparatos:
    get:
      summary: "Aparatos de las cuentas de oficina (pendientes, aprobados, revocados y caducados); es_este marca el de la sesión"
      security: [{ sesion: [] }]
      responses:
        "200": { description: ok }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/aparatos/{id}/aprobar:
    post:
      summary: "Aprueba un aparato pendiente desde otro ya aprobado; pide confirmación reciente; los de cuentas admin, solo admin"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: aprobado }
        "404": { description: no hay un aparato pendiente con ese id }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/aparatos/{id}/revocar:
    post:
      summary: "Revoca un aparato de oficina y cierra sus sesiones; los de cuentas admin, solo admin o la propia cuenta"
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: revocado }
        "404": { description: no existe o ya estaba revocado }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/sistema:
    get:
      summary: "Sistema de la oficina (OF5): salud de api, base, LiveKit, correo y hornero; OlivarTrack (última sincronía por herramienta y de cuándo es el dato); Vigía (modo y de cuándo es lo último que llegó); hornero (épocas, objetos, bytes). Solo lectura, sin secretos ni rutas"
      security: [{ sesion: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [generado_en, salud, correo, olivartrack, vigia, hornero]
                properties:
                  generado_en: { type: string, format: date-time }
                  salud: { type: array, items: { type: object, required: [id, nombre, estado, detalle], properties: { id: { enum: [api, base, livekit, correo, hornero] }, nombre: { type: string }, estado: { enum: [ok, aviso, mal, apagado] }, detalle: { type: string } } } }
                  correo: { type: object, required: [modo, ultima_prueba], properties: { modo: { enum: [smtp, buzon] }, ultima_prueba: { type: [object, "null"], properties: { cuando: { type: string, format: date-time }, ok: { type: boolean } } } } }
                  olivartrack: { type: object, required: [modo, puede_sincronizar, herramientas], properties: { modo: { enum: ["no", grabado, mcp] }, puede_sincronizar: { type: boolean }, herramientas: { type: array, items: { type: object, required: [herramienta, estado, intentada_en, consultado_en, recibidos, guardados, completa, aviso], properties: { estado: { enum: [ok, truncado, parcial, error] }, completa: { type: boolean, description: "false si vino truncada o parcial: no se sacan totales de ahí" } } } } } }
                  vigia: { type: object, required: [modo, conector, origen, herramientas] }
                  hornero: { type: object, required: [conectado, salud, detalle, latido_en, fincas] }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/auditoria:
    get:
      summary: "La auditoría, de la más reciente a la más antigua; filtro por acción y cursor `antes` (id); la primera página trae también `acciones`. Quién = rol e id del hogar, nunca el correo"
      security: [{ sesion: [] }]
      parameters:
        - { name: accion, in: query, schema: { type: string, pattern: "^[a-z_.]{1,64}$" } }
        - { name: antes, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: "{ filas: [{ id, cuando, accion, quien: { hogar, rol } | null, detalle }], siguiente: id | null, acciones?: [string] }" }
        "400": { description: entrada no válida }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/correo/prueba:
    post:
      summary: "Manda un correo de prueba a la propia cuenta de oficina (nunca a otra), sin enlace; queda en la auditoría como oficina.correo_prueba { ok }; 5 cada 10 min por cuenta"
      security: [{ sesion: [] }]
      responses:
        "200": { description: mandado }
        "429": { description: demasiadas pruebas seguidas }
        "502": { description: el correo no salió (el texto del error queda en el registro del servidor, no en la respuesta) }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/presencia/token:
    post:
      summary: Token para entrar a la sala libre de LiveKit (F2, presencia compartida; contratos/livekit-roles.json y presencia.md)
      description: >
        Sala fija «hituelo-libre» (decisiones 39 y 60). La identidad es un id opaco, uno por sesión (aparato), con el
        hogar como prefijo: h_<22>_<8> (ni correo, ni id de la base, ni id de la sesión). El mismo hogar puede estar a la
        vez en varios aparatos; dos pestañas de la misma sesión comparten identidad. Permisos del rol según livekit-roles.json: en F2 solo datos (pose y chat), sin audio ni vídeo, sin
        roomAdmin. Los metadatos (alias, avatar, rol, dispositivo) los pone la api y el cliente no puede cambiarlos.
        El token caduca a los 15 minutos (solo sirve para entrar). Nada de la sala se guarda.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [dispositivo], properties: { dispositivo: { enum: [escritorio, movil, quest] } } }
      responses:
        "200":
          description: token firmado
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, sala, identidad, token, caduca_en]
                properties:
                  url: { type: string, description: "a dónde se conecta el navegador: wss:// de LiveKit (ws:// solo fuera de producción) o una ruta del mismo origen (/rtc) que el cliente resuelve contra su página (https → wss)" }
                  sala: { const: hituelo-libre }
                  identidad: { type: string, pattern: "^h_[A-Za-z0-9_-]{22}_[A-Za-z0-9_-]{8}$" }
                  token: { type: string, description: JWT de LiveKit }
                  caduca_en: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { description: "sin Origin del sitio (origen_no_admitido) o expulsado hace menos de 15 min (expulsado)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/Limite" }
        "503": { description: la presencia está apagada en este servidor (falta GEMELO_LIVEKIT_URL) }

  /api/admin/presencia/expulsar:
    post:
      summary: Saca a un hogar de la sala libre (moderación mínima de F2, decisión 42; solo la oficina)
      description: >
        La api saca TODAS las conexiones del hogar (una por aparato: lista la sala con RoomService.ListParticipants y
        quita con RemoveParticipant las que llevan su prefijo; ningún token de cliente lleva roomAdmin), no le da token
        nuevo durante 15 minutos (en memoria: no sobrevive a un reinicio de la api) y lo apunta en la auditoría
        (admin.presencia_expulsado: hogar, sala, si estaba, cuántas conexiones y el motivo). No es un bloqueo de la cuenta: para eso, revocar
        sus sesiones o desactivar el hogar.
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hogar_id]
              properties:
                hogar_id: { type: integer, minimum: 1 }
                motivo: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: hecho (estaba o no en la sala; conexiones = cuántas se sacaron)
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [estaba_en_sala, conexiones], properties: { estaba_en_sala: { type: boolean }, conexiones: { type: integer, minimum: 0 } } }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: el hogar no existe }
        "503": { description: la presencia está apagada en este servidor }

  # ---------------------------------------------------------------- vida de las hazas (decisiones 91-97; vida.md)
  /api/hazas/{id}/olivos:
    get:
      summary: Olivos personalizados de una haza (lista blanca, sin quién lo subió)
      description: Cualquier hogar con sesión. Solo lo visible y del titular ACTUAL de la haza. Ver olivos-haza.schema.json.
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "olivos-haza.schema.json" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: no existe la haza }

  /api/olivos/{finca}/{copas_id}:
    parameters:
      - { name: finca, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9_-]{1,32}$" } }
      - { name: copas_id, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 4294967295 }, description: "id congelado del olivo (decisión 92)" }
    put:
      summary: Personaliza un olivo de MI haza (nombre y una foto o pintura ya subida)
      description: >
        Solo una sesión de titular (nacida del enlace mágico; 403 solo_titular en un aparato vinculado) y solo en un olivo que
        cae dentro de una haza asignada a su hogar (403 no_es_tu_haza). Se ve al momento; entra en la bandeja de la oficina
        como contenido nuevo. Nombre de 1-40 caracteres con filtro básico (sin enlaces, teléfonos ni palabras gruesas).
        Límite por hogar y hora (GEMELO_VIDA_ESCRITURAS_HORA).
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                nombre: { type: [string, "null"], minLength: 1, maxLength: 40, description: "omitido = se queda el que había; null = lo quita" }
                objeto:
                  type: [object, "null"]
                  additionalProperties: false
                  required: [tipo, medio_id]
                  properties: { tipo: { enum: [foto, pintura] }, medio_id: { type: integer, minimum: 1, description: "id devuelto por POST /api/medios (del propio hogar); `objeto` omitido = se queda el que había (la lista blanca no da el medio_id); null = lo quita" } }
      responses:
        "200": { description: guardada, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id], properties: { id: { type: integer } } } } } }
        "400": { description: "forma, nombre no válido (nombre_no_valido), vacío o foto ajena (medio_no_valido)" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { description: "sin Origin, aparato vinculado (solo_titular) u olivo fuera de su haza (no_es_tu_haza)" }
        "404": { description: "no hay olivo con ese id (olivo_no_existe)" }
        "409": { description: "dos cambios a la vez en el mismo olivo" }
        "429": { $ref: "#/components/responses/Limite" }
    delete:
      summary: Quita mi personalización de ese olivo (queda retirada; el fichero se purga como el de lo retirado)
      security: [{ sesion: [] }]
      responses:
        "204": { description: quitada }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { description: "sin Origin o aparato vinculado (solo_titular)" }
        "404": { description: no tenía nada en ese olivo }

  /api/medios:
    post:
      summary: Sube una foto o pintura (la imagen tal cual en el cuerpo; se re-codifica sin EXIF ni GPS)
      description: >
        Cuerpo binario con Content-Type image/jpeg, image/png o image/webp (otro tipo: 415). Se comprueba el formato por el
        contenido (un PNG que dice ser JPEG: 415), se endereza, se reduce a 1600 px de lado y se guarda en WebP sin metadatos.
        `acepto=true` es la aceptación obligatoria del aviso «sin caras de menores ni datos personales» (versión en
        vida.md); sin ella, 400. Solo sesión de titular (se comprueba antes de leer el cuerpo). Tamaño máximo
        GEMELO_MEDIOS_MAX_MB (8 MB por defecto; 413); límite por hogar y hora (GEMELO_MEDIOS_SUBIDAS_HORA). Sin GEMELO_MEDIOS, 503.
      security: [{ sesion: [] }]
      parameters:
        - { name: acepto, in: query, required: true, schema: { const: true }, description: "acepto el aviso: sin caras de menores ni datos personales" }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
          image/png: { schema: { type: string, contentMediaType: image/png } }
          image/webp: { schema: { type: string, contentMediaType: image/webp } }
      responses:
        "201":
          description: subida (aún no se ve; hay que colgarla en un olivo con PUT /api/olivos/…)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, url, ancho, alto, bytes]
                properties:
                  id: { type: integer }
                  url: { type: string, pattern: "^/api/medios/[a-f0-9]{32}\\.webp$" }
                  ancho: { type: integer, maximum: 1600 }
                  alto: { type: integer, maximum: 1600 }
                  bytes: { type: integer }
        "400": { description: "sin aceptar el aviso" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { description: "sin Origin o aparato vinculado (solo_titular)" }
        "413": { description: demasiado grande }
        "415": { description: "tipo no admitido o no es una imagen de ese tipo" }
        "429": { $ref: "#/components/responses/Limite" }
        "503": { description: "subidas apagadas (falta GEMELO_MEDIOS)" }

  /api/medios/{clave}:
    get:
      summary: El fichero, si se puede ver (colgado y visible, del diario, propio o para la oficina)
      description: Retirar un contenido corta el acceso en el acto. Caché privada de 5 minutos.
      security: [{ sesion: [] }]
      parameters:
        - { name: clave, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]{32}\\.webp$" } }
      responses:
        "200": { description: la imagen, content: { image/webp: { schema: { type: string, contentMediaType: image/webp } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: "no existe o no se puede ver (misma respuesta)" }

  /api/personalizaciones/{id}/denuncias:
    post:
      summary: Denuncia un contenido (cualquier hogar con sesión); entra en la bandeja de la oficina
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [motivo]
              properties:
                motivo: { enum: [menores, datos_personales, ofensivo, no_es_del_olivar, otro] }
                texto: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201": { description: recibida, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id], properties: { id: { type: integer } } } } } }
        "400": { description: "forma, o texto con enlaces o números largos" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: "no existe o ya no se ve" }
        "409": { description: "este hogar ya lo había denunciado" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/hazas/{id}/sugerencias:
    post:
      summary: Sugerencia del titular a la oficina sobre SU haza (opcionalmente sobre un olivo)
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [texto]
              properties:
                texto: { type: string, minLength: 1, maxLength: 1000 }
                finca: { type: string, pattern: "^[a-z0-9_-]{1,32}$" }
                copas_id: { type: integer, minimum: 0, maximum: 4294967295, description: "con finca, y solo con ella" }
      responses:
        "201": { description: recibida, content: { application/json: { schema: { type: object, additionalProperties: false, required: [id], properties: { id: { type: integer } } } } } }
        "400": { description: "forma, texto no válido o el olivo no está en la haza" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { description: "sin Origin, aparato vinculado o la haza no es suya" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/admin/bandeja:
    get:
      summary: Bandeja de la oficina (contenido nuevo, sugerencias y denuncias), lo más nuevo primero
      security: [{ sesion: [] }]
      parameters:
        - { name: estado, in: query, schema: { enum: [nueva, vista, pasada_ot, descartada] } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: ok (sin caché)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [bandeja]
                properties:
                  bandeja:
                    type: array
                    items:
                      type: object
                      required: [id, tipo, estado, creada_en, texto, hogar_id, haza, olivo, contenido]
                      properties:
                        id: { type: integer }
                        tipo: { enum: [contenido_nuevo, sugerencia, denuncia] }
                        estado: { enum: [nueva, vista, pasada_ot, descartada] }
                        creada_en: { type: string, format: date-time }
                        vista_en: { type: [string, "null"], format: date-time }
                        decidida_en: { type: [string, "null"], format: date-time }
                        ot_propuesta_id: { type: [string, "null"] }
                        texto: { type: [string, "null"] }
                        hogar_id: { type: [integer, "null"], description: "quién lo mandó (solo la oficina lo ve)" }
                        hogar_alias: { type: [string, "null"] }
                        haza: { type: [object, "null"], properties: { id: { type: integer }, codigo: { type: string } } }
                        olivo: { type: [object, "null"], properties: { finca: { type: string }, copas_id: { type: integer } } }
                        denuncia_motivo: { type: [string, "null"] }
                        contenido:
                          type: [object, "null"]
                          properties:
                            id: { type: integer }
                            nombre: { type: [string, "null"] }
                            objeto_tipo: { enum: [foto, pintura, null] }
                            url: { type: [string, "null"] }
                            estado: { enum: [visible, retirado] }
                            motivo_retirada: { type: [string, "null"] }
                            denuncias_abiertas: { type: integer }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/bandeja/{id}/estado:
    post:
      summary: Cambia el estado de una entrada (vista, pasada a OlivarTrack con el id de la propuesta, descartada)
      description: >
        El gemelo no escribe en OlivarTrack por su cuenta (decisión 94): la oficina crea la propuesta allí y apunta aquí su
        id. Descartar una denuncia la resuelve como «se mantiene». Queda en la auditoría (admin.bandeja).
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [estado]
              properties:
                estado: { enum: [vista, pasada_ot, descartada] }
                ot_propuesta_id: { type: string, pattern: "^[A-Za-z0-9:_.-]{1,64}$", description: "obligatorio con pasada_ot y solo con ella" }
      responses:
        "204": { description: hecho }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }

  /api/admin/personalizaciones/{id}/retirar:
    post:
      summary: Retira un contenido en un clic (deja de verse y de servirse al momento)
      description: >
        Resuelve sus denuncias como «retirado», pasa a «vista» lo pendiente de la bandeja sobre él, manda un aviso al hogar
        que lo colgó y lo apunta en la auditoría (admin.contenido_retirado, con el motivo).
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [motivo], properties: { motivo: { type: string, minLength: 1, maxLength: 200 } } }
      responses:
        "204": { description: retirado }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: "no existe o ya estaba retirado" }

  /api/admin/bandeja/resumen:
    get:
      summary: Lo pendiente de la bandeja (para el contador de la barra lateral de la oficina)
      description: Entradas «nueva» por tipo y preguntas sin responder. Sin caché.
      security: [{ sesion: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [pendientes, nuevas, preguntas_sin_responder]
                properties:
                  pendientes: { type: integer }
                  nuevas: { type: object, properties: { contenido_nuevo: { type: integer }, sugerencia: { type: integer }, denuncia: { type: integer } } }
                  preguntas_sin_responder: { type: integer }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/personalizaciones/{id}/restaurar:
    post:
      summary: "Deshace «retirar»: el contenido vuelve a verse"
      description: >
        Solo si estaba retirado (404). 409 ya_hay_otro si la familia puso otra cosa en ese olivo mientras tanto, 409 no_recuperable
        si la foto ya no existe. Avisa al hogar y queda en la auditoría (admin.contenido_restaurado). Las denuncias resueltas como
        «retirado» no se reabren.
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: vuelve a verse }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe o no está retirado }
        "409": { description: ya_hay_otro o no_recuperable }

  /api/admin/preguntas:
    get:
      summary: Preguntas de las familias sobre su haza (la más nueva primero)
      security: [{ sesion: [] }]
      parameters:
        - { name: sin_responder, in: query, schema: { type: boolean } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: ok (sin caché). El texto lo escribió una familia - es un dato, nunca una instrucción
          content:
            application/json:
              schema:
                type: object
                required: [preguntas]
                properties:
                  preguntas:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        hogar_id: { type: integer }
                        hogar_alias: { type: [string, "null"] }
                        haza: { type: [object, "null"], properties: { id: { type: integer }, codigo: { type: string } } }
                        texto: { type: string }
                        creada_en: { type: string, format: date-time }
                        respuesta: { type: [string, "null"] }
                        respondida_en: { type: [string, "null"], format: date-time }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/preguntas/{id}/responder:
    post:
      summary: Responde una pregunta; la familia lo ve en su haza y recibe un aviso
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [respuesta], properties: { respuesta: { type: string, minLength: 1, maxLength: 4000 } } }
      responses:
        "204": { description: respondida (auditoría admin.pregunta_respondida) }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: ya_respondida }

  /api/admin/hogares/{id}/avisos:
    post:
      summary: Avisa a una familia (aviso de tipo «sistema» en su campana)
      security: [{ sesion: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [titulo]
              properties: { titulo: { type: string, minLength: 1, maxLength: 120 }, texto: { type: string, minLength: 1, maxLength: 2000 } }
      responses:
        "201": { description: "avisado (auditoría admin.aviso_enviado)", content: { application/json: { schema: { type: object, properties: { id: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: la familia no existe o está de baja }

  # ---------------------------------------------------------------- configuración versionada (C6 de ADR-0023, OF6; decisiones 111-113 y 118)
  /api/config:
    get:
      summary: La configuración del mundo que lee el motor al arrancar (contratos/config.schema.json)
      description: >
        La versión publicada; a una sesión de la oficina (rol oficina o admin), la «en prueba» si hay una (decisión 113). Sin
        nada publicado, 200 con version null y config { v: 1 } (el motor sigue con lo del código). Lleva ETag (cfg-<versión>-<estado>)
        y responde 304 a If-None-Match; caché privada que siempre pregunta. Sin datos de la explotación ni secretos.
      security: [{ sesion: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [version, estado, desde, config]
                properties:
                  version: { type: [integer, "null"] }
                  estado: { enum: [publicada, en_prueba, null] }
                  desde: { type: [string, "null"], format: date-time, description: cuándo pasó a ese estado }
                  config: { $ref: "config.schema.json" }
        "304": { description: sin cambios (If-None-Match) }
        "401": { $ref: "#/components/responses/SinSesion" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/admin/config:
    get:
      summary: Historial de versiones de la configuración (sin el cuerpo) y cuál está publicada y cuál en prueba
      security: [{ sesion: [] }]
      responses:
        "200": { description: "{ publicada, en_prueba, versiones: [{ version, estado, nota, autor_id, copia_de, creada_en, estado_en }] } (las 200 últimas)" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
    post:
      summary: Crea un borrador (validado contra config.schema.json y sus reglas entre campos)
      description: >
        Límites de la decisión 111 (en las gafas los presupuestos solo bajan), E1 ≤ E0 / 1,5 y E2 ≤ E1 / 1,5, y épocas que cubren
        los 366 días con una sola época por día. Queda en la auditoría (config.borrador).
      security: [{ sesion: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [cuerpo]
              properties:
                cuerpo: { $ref: "config.schema.json" }
                nota: { type: string, maxLength: 500 }
      responses:
        "201": { description: "{ version, estado: borrador }" }
        "400": { description: "no cumple el contrato (config_no_valida, con detalles) o la petición no tiene la forma esperada", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }

  /api/admin/config/{version}:
    get:
      summary: Una versión con su cuerpo
      security: [{ sesion: [] }]
      parameters: [{ name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: "{ version, estado, nota, autor_id, copia_de, creada_en, estado_en, cuerpo }" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }

  /api/admin/config/{version}/prueba:
    post:
      summary: Pasa un borrador a «en prueba» (solo lo ven las cuentas de la oficina); retira la prueba anterior
      security: [{ sesion: [] }]
      parameters: [{ name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: "{ version, estado: en_prueba, retirada }" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "no es un borrador (estado_no_permitido) o alguien cambió la configuración a la vez (a_la_vez)" }

  /api/admin/config/{version}/publicar:
    post:
      summary: Publica para todos la versión en prueba; retira la publicada anterior
      description: Pide confirmación reciente (403 confirmacion_requerida; ADR-0024). Si la api tiene GEMELO_CONFIG_SALIDA, deja también ahí el cuerpo publicado (el hornero lee de él el calendario de épocas). Auditoría config.publicada.
      security: [{ sesion: [] }]
      parameters: [{ name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: "{ version, estado: publicada, retirada }" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "no está en prueba (estado_no_permitido) o alguien cambió la configuración a la vez (a_la_vez)" }

  /api/admin/config/{version}/retirar:
    post:
      summary: Descarta un borrador o una prueba (la publicada no se retira así; se publica otra o se vuelve a una vieja)
      security: [{ sesion: [] }]
      parameters: [{ name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "200": { description: "{ version, estado: retirada }" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: no es un borrador ni una prueba }

  /api/admin/config/{version}/volver:
    post:
      summary: Vuelve a una versión vieja publicando una COPIA suya como versión nueva (la vieja no se toca)
      description: >
        Nunca se reescribe una versión. La copia nace publicada (copia_de = la vieja) y retira la publicada de antes; la vieja
        tiene que cumplir el contrato de hoy. No vale para un borrador. Pide confirmación reciente (403 confirmacion_requerida). Auditoría config.vuelta.
      security: [{ sesion: [] }]
      parameters: [{ name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }]
      responses:
        "201": { description: "{ version (la nueva), estado: publicada, copia_de, retirada }" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { description: no existe }
        "409": { description: "es un borrador, ya no cumple el contrato (config_no_valida) o alguien cambió la configuración a la vez" }

  /api/juegos/{id}/partidas:
    post:
      summary: Guarda una partida acabada de un juego casual del hogar (C9a; doc/sistema/JUEGOS.md)
      description: >
        Cualquier sesión del hogar (también la de unas gafas vinculadas). Solo juegos que existen (hoy, cae-la-cosecha). Se rechaza
        (422 partida_no_creible) una duración fuera de 3-3600 s o más puntos de los que caben en esa duración (base + porSegundo ×
        duración, el mismo tope que el juego). Límite por IP (20 por minuto) y por hogar (60 por hora). Devuelve el récord del hogar.
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [puntos, duracion_s]
              properties:
                puntos: { type: integer, minimum: 0, maximum: 10000000 }
                duracion_s: { type: integer, minimum: 1, maximum: 86400 }
      responses:
        "201": { description: guardada, content: { application/json: { schema: { $ref: "#/components/schemas/RecordJuego" } } } }
        "400": { $ref: "#/components/responses/EntradaNoValida" }
        "401": { $ref: "#/components/responses/SinSesion" }
        "403": { $ref: "#/components/responses/OrigenNoAdmitido" }
        "404": { description: no existe ese juego }
        "422": { description: "partida_no_creible: duración o puntos fuera de lo posible; no se guarda" }
        "429": { $ref: "#/components/responses/Limite" }

  /api/juegos/{id}/records:
    get:
      summary: El récord del PROPIO hogar en un juego y cuántas partidas lleva (nada de otras familias)
      security: [{ sesion: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: "#/components/schemas/RecordJuego" } } } }
        "401": { $ref: "#/components/responses/SinSesion" }
        "404": { description: no existe ese juego }
        "429": { $ref: "#/components/responses/Limite" }
