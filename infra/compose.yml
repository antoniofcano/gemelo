# Producción del gemelo en el VPS de OVH, como INQUILINO de la red `borde` (ADR-0011). Runbook: doc/operacion/RUNBOOK-VPS.md.
# - NINGÚN puerto publicado: el Caddy de Oficultor llega al Caddy interno (`web`) por la red externa `borde`
#   (bloque en infra/bloque-borde.txt). Docker se salta ufw con los puertos publicados: por eso no hay ninguno.
# - La base solo está en la red `bd` (internal: sin salida); la api sale a Internet (SMTP de OVH, MCP de OlivarTrack)
#   por la red `interna`.
# - Secretos en ficheros fuera del repo (/etc/gemelo/secretos/, ver infra/entorno.ejemplo); nada en variables.
# - Imágenes fijadas por versión exacta Y digest; las mismas que infra/dev (comprobadas el 2026-10-29, ver RUNBOOK-VPS).
#   Al cambiar una, cámbiala también en infra/dev/compose.yml y en contratos/publicacion-vps.json.
name: gemelo

services:
  db:
    image: postgis/postgis:18-3.6-alpine@sha256:c53a483fc274072dfa02cd491efa79f3c8ae0a10774a0ece6c9c53b6a632cdef
    restart: unless-stopped
    environment:
      POSTGRES_DB: gemelo
      POSTGRES_USER: gemelo_dueno
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_dueno
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
      GEMELO_PG_API_CLAVE_FICHERO: /run/secrets/pg_api
    secrets: [pg_dueno, pg_api]
    volumes:
      # PostgreSQL 18: el volumen va en /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - pg_datos:/var/lib/postgresql
      - ./bd-inicial:/docker-entrypoint-initdb.d:ro
    networks: [bd]
    shm_size: 256mb
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemelo_dueno -d gemelo"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Aplica las migraciones pendientes con el usuario DUEÑO y termina; la api arranca después (y no puede cambiar el esquema).
  migra:
    image: gemelo-api:0.2.0
    build: { context: .., dockerfile: apps/api/Dockerfile }
    command: ["node", "dist/src/bd/migra-cli.js"]
    restart: "no"
    environment:
      NODE_ENV: production
      GEMELO_DB_URL: "postgresql://gemelo_dueno@db:5432/gemelo"
      GEMELO_DB_CLAVE_FICHERO: /run/secrets/pg_dueno
    secrets: [pg_dueno]
    networks: [bd]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  api:
    image: gemelo-api:0.2.0
    build: { context: .., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file: [/etc/gemelo/entorno]
    environment:
      NODE_ENV: production
      GEMELO_API_PUERTO: "8000"
      GEMELO_DB_URL: "postgresql://gemelo_api@db:5432/gemelo"
      GEMELO_DB_CLAVE_FICHERO: /run/secrets/pg_api
      GEMELO_SESION_SECRETO_FICHERO: /run/secrets/sesion_secreto
      GEMELO_SMTP_CLAVE_FICHERO: /run/secrets/smtp_clave
      GEMELO_OT_TOKEN_FICHERO: /run/secrets/ot_token
      # el token de Vigía (el tiempo): descomentar esta línea, `vigia_token` en secrets y el secreto del final cuando exista
      # /etc/gemelo/secretos/vigia_token y /etc/gemelo/entorno traiga GEMELO_VIGIA=mcp (sin el fichero, el compose no arranca)
      # GEMELO_VIGIA_TOKEN_FICHERO: /run/secrets/vigia_token
      # F2: el API secret de LiveKit (firma los tokens de la sala). Solo se lee si /etc/gemelo/entorno trae GEMELO_LIVEKIT_URL
      GEMELO_LIVEKIT_SECRETO_FICHERO: /run/secrets/livekit_secreto
      # V7: las fotos de los hogares (contratos/vida.md), en el volumen `medios` (entra en las copias: infra/respaldo.sh). El tope por foto
      # y el resto (GEMELO_MEDIOS_MAX_MB…) vienen de /etc/gemelo/entorno; si GEMELO_MEDIOS_MAX_MB pasa de 8, sube también max_size de /api/medios
      # en infra/Caddyfile y en infra/bloque-borde.txt
      GEMELO_MEDIOS: /datos/medios
      # V10: la configuración publicada desde la oficina, también en un fichero para el hornero (volumen `config_publicada`, que él monta de solo lectura)
      GEMELO_CONFIG_SALIDA: /datos/config/publicada.json
    volumes:
      - medios:/datos/medios
      - config_publicada:/datos/config
    secrets: [pg_api, sesion_secreto, smtp_clave, ot_token, livekit_secreto]
    networks: [bd, interna]
    depends_on:
      migra: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/salud').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # El hornero de olivos (ADR-0018, O7f; tuberia/olivos/servicio.mjs). SIN DESPLEGAR todavía: no se levanta hasta que lo decida Antonio
  # (RUNBOOK-VPS § El hornero). Hornea las variantes E2/E2-VR de la finca en /srv/gemelo/publicado/teselas/<finca>/olivos/ (lo que Caddy sirve
  # en /teselas/<finca>/olivos/), lee el índice de la finca de solo lectura y deja su estado en un volumen propio. Ni puertos ni salida a
  # Internet (red `bd`, internal). Una vuelta al arrancar y otra solo si cambia el índice, el calendario, GEN_VERSION/CACHE_VERSION o llega
  # el cambio de época (a las 03:00 UTC, GEMELO_HORNERO_HORA); entre medias mira sellos baratos cada 10 min. Para otra finca, repetir
  # las dos líneas de teselas y GEMELO_HORNERO_FINCAS. La carpeta olivos/ debe existir y ser del uid 1000 (RUNBOOK-VPS).
  hornero:
    image: gemelo-hornero:0.2.0
    build: { context: .., dockerfile: tuberia/olivos/Dockerfile }
    profiles: [hornero]      # no arranca con un `up -d` normal: `docker compose -f infra/compose.yml --profile hornero up -d hornero`
    restart: unless-stopped
    environment:
      GEMELO_HORNERO_FINCAS: hituelo
      GEMELO_HORNERO_HORA: "03:00"
      # V10: la configuración publicada (calendario de épocas) que deja la api; sin fichero, el hornero usa el calendario del contrato
      GEMELO_HORNERO_CONFIG: /config/publicada.json
    volumes:
      - config_publicada:/config:ro
      - /srv/gemelo/publicado/teselas/hituelo:/datos/hituelo:ro
      - /srv/gemelo/publicado/teselas/hituelo/olivos:/salida/hituelo/olivos
      - hornero_estado:/estado
    networks: [bd]
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "tuberia/olivos/salud.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Caddy INTERNO: estáticos (portada pública; finca y teselas tras sesión), cabeceras de seguridad y proxy a la api.
  web:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/gemelo/publicado:/srv:ro
      - caddy_datos:/data
      - caddy_config:/config
    networks:
      interna: {}
      borde:
        aliases: [gemelo-web]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

networks:
  bd:
    internal: true
  interna: {}
  borde:
    external: true

volumes:
  pg_datos: {}
  caddy_datos: {}
  caddy_config: {}
  hornero_estado: {}
  medios: {}              # V7: fotos de los hogares; en las copias (infra/respaldo.sh)
  config_publicada: {}    # V10: la api escribe, el hornero lee; regenerable desde la base (config_versiones): sin copia propia

secrets:
  pg_dueno: { file: /etc/gemelo/secretos/pg_dueno }
  pg_api: { file: /etc/gemelo/secretos/pg_api }
  sesion_secreto: { file: /etc/gemelo/secretos/sesion_secreto }
  smtp_clave: { file: /etc/gemelo/secretos/smtp_clave }
  ot_token: { file: /etc/gemelo/secretos/ot_token }
  # vigia_token: { file: /etc/gemelo/secretos/vigia_token }
  livekit_secreto: { file: /etc/gemelo/secretos/livekit_secreto }
