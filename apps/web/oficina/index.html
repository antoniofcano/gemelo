<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Oficina · Cuarenta hazas</title>
<!-- La oficina (/oficina/, doc/sistema/OFICINA.md, ADR-0024). OF1: página mínima «en construcción»; las secciones llegan con OF2.
     Sin three ni motor; sin nada en línea (CSP estricta: script-src 'self'; style-src 'self'). Caddy solo la sirve con una
     sesión de oficina (forward_auth a /api/interno/autoriza?para=oficina), y la api vuelve a comprobarlo en cada ruta. -->
<link rel="stylesheet" href="./oficina.css">
<script type="module" src="./oficina.js"></script>
</head>
<body>
<p class="vh" id="anuncio" role="status" aria-live="polite"></p>
<header class="barra">
  <h1>Oficina</h1>
  <a class="btn" href="/finca/">Entrar al mundo como oficina</a>
  <button type="button" class="btn btn-txt" id="salir">Cerrar sesión</button>
</header>
<main class="caja" id="principal">
  <h2>En construcción</h2>
  <p>Aquí estarán Familias, Hazas, Bandeja, Agenda, Directos, Mundo, Olivos y Sistema (<a href="/">portada</a>).</p>
  <section aria-labelledby="t-sesion">
    <h3 id="t-sesion">Tu sesión de oficina</h3>
    <dl id="sesion">
      <dt>Cuenta</dt><dd id="s-rol">—</dd>
      <dt>Este aparato</dt><dd id="s-aparato">—</dd>
      <dt>Caduca</dt><dd id="s-caduca">—</dd>
      <dt>Confirmación reciente</dt><dd id="s-confirmacion">—</dd>
    </dl>
  </section>
</main>
</body>
</html>
